# SQL Server profile for local/dev environment
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=spring_sqs_aws;encrypt=true;trustServerCertificate=true;loginTimeout=30}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Passw0rd}

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Optional: keep H2 console disabled in dev SQL Server profile
spring.h2.console.enabled=false
