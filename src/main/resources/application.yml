spring:
  application:
    name: spring-sqs-aws

  datasource:
    url: jdbc:h2:mem:eventsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sqs:
        # Desabilitado por padrão para permitir desenvolvimento local sem AWS/Docker
        enabled: ${APP_SQS_ENABLED:false}
        endpoint: ${AWS_SQS_ENDPOINT:}

app:
  sqs:
    # Flag mestre que controla a inicialização dos beans do SQS e @SqsListener
    enabled: ${APP_SQS_ENABLED:false}
    queues:
      events-queue: ${EVENTS_QUEUE_NAME:events-hub-queue}
      events-dlq: ${EVENTS_DLQ_NAME:events-hub-dlq}
    listener:
      max-concurrent-messages: ${SQS_MAX_CONCURRENT_MESSAGES:10}
      max-messages-per-poll: ${SQS_MAX_MESSAGES_PER_POLL:10}
      poll-timeout-seconds: ${SQS_POLL_TIMEOUT_SECONDS:10}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    br.com.stapassoli: DEBUG
    io.awspring.cloud.sqs: INFO
    software.amazon.awssdk: WARN
