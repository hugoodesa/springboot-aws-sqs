# Spring Application
spring.application.name=spring-sqs-aws

# Default profile keeps local H2 in memory for execution without external database.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Datasource
spring.datasource.url=jdbc:h2:mem:eventsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.defer-datasource-initialization=true
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring Cloud AWS
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:test}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:test}
spring.cloud.aws.sqs.enabled=${APP_SQS_ENABLED:false}
spring.cloud.aws.sqs.endpoint=${AWS_SQS_ENDPOINT:}

# Custom Application SQS Properties
#Consumer
app.sqs.enabled=${APP_SQS_ENABLED:false}
app.sqs.queues.events-queue=${EVENTS_QUEUE_NAME:sq-finance-invoicemanager-bank-return-dev}
app.sqs.queues.events-dlq=${EVENTS_DLQ_NAME:sq-finance-invoicemanager-bank-return-dev-dlq}
app.sqs.listener.max-concurrent-messages=${SQS_MAX_CONCURRENT_MESSAGES:10}
app.sqs.listener.max-messages-per-poll=${SQS_MAX_MESSAGES_PER_POLL:10}
app.sqs.listener.poll-timeout-seconds=${SQS_POLL_TIMEOUT_SECONDS:10}

#PRODUCER
app.sqs.producer.enabled=${APP_SQS_PRODUCER_ENABLED:false}
app.sqs.producer.queues.events-queue=${EVENTS_QUEUE_NAME:sq-finance-invoicemanager-bank-return-dev}
app.sqs.producer.queues.events-dlq=${EVENTS_DLQ_NAME:sq-finance-invoicemanager-bank-return-dev-dlq}

# SpringDoc / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=false

# Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.br.com.stapassoli=DEBUG
logging.level.io.awspring.cloud.sqs=INFO
logging.level.software.amazon.awssdk=WARN